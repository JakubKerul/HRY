[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>
(function(){
  // Echo Run ako Discord Activity: spusti sa len vnutri Discordu (*.discordsays.com)
  if (!/\\.discordsays\\.com$/.test(location.hostname)) return;
  window.__inDiscord = true;
  window.__dcCode = ''; window.__dcErr = '';
  var CID = '1571505542361382982';
  var ready = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = 'discord_sdk.js';
    s.onload = function(){
      try {
        window.patchUrlMappings([
          {prefix: '/gas', target: 'script.google.com'},
          {prefix: '/gasu', target: 'script.googleusercontent.com'}
        ]);
        var sdk = new window.DiscordSDK(CID);
        window.__discordSdk = sdk;
        sdk.ready().then(function(){ res(sdk); }).catch(rej);
      } catch(e) { rej(e); }
    };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  // Godot zavola __dcLogin(); vysledok si prevezme z __dcCode / __dcErr
  window.__dcLogin = function(){
    window.__dcCode = ''; window.__dcErr = '';
    ready.then(function(sdk){
      return sdk.commands.authorize({client_id: CID, response_type: 'code', state: '', prompt: 'none', scope: ['identify']});
    }).then(function(r){ window.__dcCode = (r && r.code) || ''; if (!window.__dcCode) window.__dcErr = 'nocode'; })
      .catch(function(e){ window.__dcErr = String((e && e.message) || e || 'err'); console.error('[EchoRun] Discord login', e); });
  };
})();
</script>
"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
